server:
  port: 8085

spring:
  application:
    name: careconnect-ehr
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/careconnectdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521:XE}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${ORACLE_USERNAME:system}
    password: ${ORACLE_PASSWORD:oracle}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
careconnect:
  jwt:
    secret: careconnectSecretKeyForEHRPlatformWithHighEntropy2026SecureKeyMustBeLongEnough!
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:3000"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
