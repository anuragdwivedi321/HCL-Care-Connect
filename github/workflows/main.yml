name: CareConnect EHR - Build & Verification Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ==========================================
  # JOB 1: Backend (Spring Boot + Java 21)
  # ==========================================
  backend:
    name: Build Backend (Spring Boot & Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        working-directory: ./backend
        run: chmod +x mvnw

      - name: Build & Package Spring Boot Application
        working-directory: ./backend
        run: ./mvnw clean package -DskipTests

      - name: Archive Backend Executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: careconnect-ehr-backend
          path: backend/target/*.jar
          retention-days: 5

  # ==========================================
  # JOB 2: Frontend (Angular 17 + Node.js 20)
  # ==========================================
  frontend:
    name: Build Frontend (Angular 17 & Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular Production Distribution
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build Artifacts Exist
        run: |
          test -f frontend/dist/frontend/browser/index.html || exit 1
          echo "Production build verified successfully!"

      - name: Archive Frontend Production Build
        uses: actions/upload-artifact@v4
        with:
          name: careconnect-ehr-frontend-dist
          path: frontend/dist/frontend/browser/
          retention-days: 5
